<svg xmlns="http://www.w3.org/2000/svg" width="900" height="132" viewBox="0 0 900 132" xml:space="preserve" role="img" aria-label="Bandera a cuadros: gracias por la visita"><style>@font-face{font-family:TW;font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .disp{font-family:TW,'Titillium Web',Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.caret{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lit{opacity:0;animation:lit 1s steps(1)}
@keyframes lit{0%,100%{opacity:1}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
      <pattern id="chk" width="24" height="24" patternUnits="userSpaceOnUse">
        <rect width="24" height="24" fill="#0b0b0f"/>
        <rect width="12" height="12" fill="#f3f3f6"/><rect x="12" y="12" width="12" height="12" fill="#f3f3f6"/>
        <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="24 0" dur="1.6s" repeatCount="indefinite"/>
      </pattern>
      <linearGradient id="fade" x1="0" x2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff" stop-opacity="1"/>
        <stop offset=".8" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <mask id="m"><rect width="900" height="132" fill="url(#fade)"/></mask></defs><rect y="8" width="900" height="24" fill="url(#chk)" mask="url(#m)"/><text x="450.0" y="78" text-anchor="middle" class="disp" font-size="30" font-weight="900" font-style="italic" letter-spacing="1" fill="#f3f3f6">GRACIAS POR LA VISITA</text><path d="M410.0 92h80l-4 5h-80z" fill="#ff2a1f"/><text x="450.0" y="122" text-anchor="middle" class="mono" font-size="13" fill="#8d8d9a">box, box · nos vemos en la próxima vuelta · Lima, Perú</text></svg>