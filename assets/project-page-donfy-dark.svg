<svg xmlns="http://www.w3.org/2000/svg" width="440" height="168" viewBox="0 0 440 168" xml:space="preserve" role="img" aria-label="Proyecto Page-Donfy"><style>@font-face{font-family:TW;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:TW;font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}
.sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace} .disp{font-family:TW,'Titillium Web',Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.caret{animation:blink 1.1s steps(1) infinite}
