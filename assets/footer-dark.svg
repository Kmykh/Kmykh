<svg xmlns="http://www.w3.org/2000/svg" width="900" height="116" viewBox="0 0 900 116" xml:space="preserve" role="img" aria-label="Gracias por la visita"><style>@font-face{font-family:TW;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
