<svg xmlns="http://www.w3.org/2000/svg" width="440" height="420" viewBox="0 0 440 420" xml:space="preserve" role="img" aria-label="Radar de habilidades"><style>
.sans{font-family:Inter,'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in .7s cubic-bezier(.2,.8,.2,1) both}
