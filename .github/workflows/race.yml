name: Carrera de contribuciones

# Genera race-dark.svg / race-light.svg (un monoplaza que recorre el calendario de
# contribuciones) y los publica en la rama `output`, que es la que lee el README.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/race.py"
      - "scripts/build.py"
      - "scripts/fonts.py"
      - ".github/workflows/race.yml"

permissions:
  contents: write

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instala fonttools
        run: pip install fonttools brotli

      - name: Genera la carrera
        run: python scripts/race.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Publica en la rama output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Actualiza la carrera de contribuciones"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
